name: Docker image

on:
  pull_request:
    branches: [main, master, next]
  push:
    branches: ["**"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      dockerfile: ${{ steps.plan.outputs.dockerfile }}
      has-image: ${{ steps.plan.outputs.has-image }}
      image: ${{ steps.plan.outputs.image }}
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - name: Collect changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "release" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            exit 0
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            git ls-tree -r --name-only "$HEAD_SHA" > changed-paths.txt
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-paths.txt
          fi
      - name: Create build plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ -f changed-paths.txt ]]; then
            export CHANGED_PATHS="$(cat changed-paths.txt)"
          fi
          node .github/scripts/docker-plan.mjs

  build-image:
    needs: changes
    if: needs.changes.outputs.has-image == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ needs.changes.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.changes.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 公開ビルド: タグを付けずダイジェストのみを push し、後段でマニフェストに束ねる
      - name: Build and push by digest
        id: build
        if: needs.changes.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ needs.changes.outputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            CRAIG_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=craig-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=craig-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # PR: 検証のみ。push しない
      - name: Build only
        if: needs.changes.outputs.publish != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ needs.changes.outputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            CRAIG_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=craig-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=craig-${{ matrix.arch }}

      - name: Export digest
        if: needs.changes.outputs.publish == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: needs.changes.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-image:
    needs: [changes, build-image]
    if: needs.changes.outputs.has-image == 'true' && needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ needs.changes.outputs.image }}
      TAG: ${{ needs.changes.outputs.tag }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:${TAG}-${SHORT_SHA}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${TAG}"

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Validate Compose config
        run: docker compose --env-file docker.env.example config
